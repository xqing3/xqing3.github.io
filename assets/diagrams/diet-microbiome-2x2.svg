<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 372" role="img" aria-labelledby="d2x2-title d2x2-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="currentColor">
  <title id="d2x2-title">2×2 diet × microbiome design</title>
  <desc id="d2x2-desc">Germ-free or SPF (microbiome-colonized) mice, each fed a high-fat diet or a high-fat diet with added cholesterol. The Trem2⁺/Gpnmb⁺/Cd9⁺ macrophage state was enriched in colonized, cholesterol-fed mice.</desc>

  <!-- Column headers: diet -->
  <g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round">
    <rect x="207" y="12" width="22" height="12" rx="4" fill="currentColor" fill-opacity="0.08"/>
    <rect x="374" y="12" width="22" height="12" rx="4" fill="currentColor" fill-opacity="0.08"/>
    <path d="M410 11 L415.2 14 L415.2 20 L410 23 L404.8 20 L404.8 14 Z M415.2 14 L420.4 11 L425.6 14 L425.6 20 L420.4 23 L415.2 20" stroke="#f2b84b" stroke-width="2"/>
  </g>
  <text x="218" y="48" font-size="16" font-weight="600" text-anchor="middle">High-fat diet</text>
  <text x="410" y="48" font-size="16" font-weight="600" text-anchor="middle">High-fat + cholesterol</text>

  <!-- Row headers: microbiome -->
  <g fill="none" stroke="#2f9e6b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="47" y="102" width="20" height="11" rx="5.5" fill="#2f9e6b" fill-opacity="0.15"/>
    <path d="M67 107.5 q4 -4 8 0 t8 0"/>
    <path d="M42 120 L82 96" stroke="currentColor" stroke-width="1.75"/>
    <rect x="34" y="250" width="20" height="11" rx="5.5" fill="#2f9e6b" fill-opacity="0.15"/>
    <rect x="62" y="240" width="20" height="11" rx="5.5" fill="#2f9e6b" fill-opacity="0.15" transform="rotate(-25 72 245.5)"/>
    <rect x="58" y="262" width="20" height="11" rx="5.5" fill="#2f9e6b" fill-opacity="0.15" transform="rotate(15 68 267.5)"/>
  </g>
  <text x="60" y="146" font-size="16" font-weight="600" text-anchor="middle">Germ-free</text>
  <text x="60" y="164" font-size="13" text-anchor="middle" fill-opacity="0.7">no microbiome</text>
  <text x="60" y="298" font-size="16" font-weight="600" text-anchor="middle">SPF</text>
  <text x="60" y="316" font-size="13" text-anchor="middle" fill-opacity="0.7">colonized</text>

  <!-- Cells -->
  <g stroke="currentColor" stroke-opacity="0.28" stroke-width="1.25" fill="currentColor" fill-opacity="0.035">
    <rect x="128" y="64" width="180" height="140" rx="6"/>
    <rect x="320" y="64" width="180" height="140" rx="6"/>
    <rect x="128" y="216" width="180" height="140" rx="6"/>
  </g>
  <rect x="320" y="216" width="180" height="140" rx="6" fill="#f2b84b" fill-opacity="0.13" stroke="#f2b84b" stroke-width="2.5"/>

  <!-- Shared icons: mouse (facing right) and liver -->
  <defs>
    <g id="d2x2-mouse" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-24 6 Q-24 -14 0 -14 Q16 -14 28 4 Q14 10 -2 10 L-20 10 Q-24 10 -24 6 Z" fill="currentColor" fill-opacity="0.08"/>
      <circle cx="8" cy="-14" r="6" fill="currentColor" fill-opacity="0.08"/>
      <circle cx="17" cy="-3" r="1.6" fill="currentColor" stroke="none"/>
      <path d="M-24 6 C-34 9 -36 -2 -44 2"/>
      <path d="M-12 10 v4 M10 10 v4"/>
    </g>
    <g id="d2x2-liver" fill="#2f9e6b" fill-opacity="0.2" stroke="#2f9e6b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <path d="M-22 -8 C-14 -18 14 -18 24 -12 C30 -8 26 0 18 4 C8 10 -6 14 -16 10 C-26 6 -28 -2 -22 -8 Z"/>
      <path d="M2 -14 C0 -4 2 4 6 8" fill="none"/>
    </g>
    <g id="d2x2-microbes" fill="#2f9e6b" fill-opacity="0.15" stroke="#2f9e6b" stroke-width="1.75">
      <rect x="-20" y="-4" width="14" height="8" rx="4"/>
      <rect x="2" y="-4" width="14" height="8" rx="4" transform="rotate(-20 9 0)"/>
    </g>
  </defs>
  <use href="#d2x2-mouse" x="186" y="116"/>
  <use href="#d2x2-liver" x="262" y="116"/>
  <use href="#d2x2-mouse" x="378" y="116"/>
  <use href="#d2x2-liver" x="454" y="116"/>
  <use href="#d2x2-mouse" x="186" y="268"/>
  <use href="#d2x2-liver" x="262" y="268"/>
  <use href="#d2x2-microbes" x="190" y="300"/>
  <use href="#d2x2-mouse" x="378" y="258"/>
  <use href="#d2x2-liver" x="454" y="258"/>
  <use href="#d2x2-microbes" x="382" y="288"/>

  <text x="410" y="322" font-size="14" font-weight="600" text-anchor="middle">Trem2⁺/Gpnmb⁺/Cd9⁺</text>
  <text x="410" y="341" font-size="13" text-anchor="middle">macrophage state enriched</text>
</svg>
