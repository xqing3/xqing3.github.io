<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 566" role="img" aria-labelledby="dpipe-title dpipe-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="currentColor">
  <title id="dpipe-title">scRNA-seq analysis pipeline</title>
  <desc id="dpipe-desc">Liver non-parenchymal cells from 10x Genomics (180,152 cells) pass through quality control, Scrublet doublet removal, highly variable gene selection, PCA, batch integration, UMAP, Leiden clustering, marker discovery and annotation, and pseudobulk differential expression; 143,221 cells × 27,120 genes are kept.</desc>

  <defs>
    <g id="dpipe-liver" fill="#2f9e6b" fill-opacity="0.2" stroke="#2f9e6b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <path d="M-22 -8 C-14 -18 14 -18 24 -12 C30 -8 26 0 18 4 C8 10 -6 14 -16 10 C-26 6 -28 -2 -22 -8 Z"/>
      <path d="M2 -14 C0 -4 2 4 6 8" fill="none"/>
    </g>
    <g id="dpipe-cell" stroke="#3b72c4" stroke-width="2" stroke-linejoin="round">
      <circle r="13" fill="#3b72c4" fill-opacity="0.15"/>
      <path d="M-6 -3 C-6 -8 3 -8 5 -4 C6 -1 3 0 3 3 C3 6 -6 6 -6 -3 Z" fill="#3b72c4" fill-opacity="0.45"/>
    </g>
    <path id="dpipe-chev" d="M-5 -2 L0 2 L5 -2" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>

  <!-- Input -->
  <rect x="24" y="12" width="432" height="58" rx="6" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.25"/>
  <use href="#dpipe-liver" x="62" y="42"/>
  <text x="100" y="37" font-size="15" font-weight="600">Liver non-parenchymal cells</text>
  <text x="100" y="58" font-size="14" fill-opacity="0.75">10x Genomics · 180,152 cells</text>
  <use href="#dpipe-chev" x="152" y="84"/>

  <!-- Steps -->
  <g fill="#3b72c4" fill-opacity="0.12" stroke="#3b72c4" stroke-width="1.5">
    <rect x="24" y="96" width="256" height="32" rx="16"/>
    <rect x="24" y="138" width="256" height="32" rx="16"/>
    <rect x="24" y="180" width="256" height="32" rx="16"/>
    <rect x="24" y="222" width="256" height="32" rx="16"/>
    <rect x="24" y="264" width="256" height="32" rx="16"/>
    <rect x="24" y="306" width="256" height="32" rx="16"/>
    <rect x="24" y="348" width="256" height="32" rx="16"/>
    <rect x="24" y="390" width="256" height="32" rx="16"/>
    <rect x="24" y="432" width="256" height="32" rx="16"/>
  </g>
  <g font-size="15" text-anchor="middle">
    <text x="152" y="117">Quality control</text>
    <text x="152" y="159">Scrublet doublet removal</text>
    <text x="152" y="201">Highly variable genes</text>
    <text x="152" y="243">PCA</text>
    <text x="152" y="285">Batch integration</text>
    <text x="152" y="327">UMAP</text>
    <text x="152" y="369">Leiden clustering</text>
    <text x="152" y="411">Markers &amp; annotation</text>
    <text x="152" y="453" font-weight="600">Pseudobulk DE</text>
  </g>
  <use href="#dpipe-chev" x="152" y="134"/>
  <use href="#dpipe-chev" x="152" y="176"/>
  <use href="#dpipe-chev" x="152" y="218"/>
  <use href="#dpipe-chev" x="152" y="260"/>
  <use href="#dpipe-chev" x="152" y="302"/>
  <use href="#dpipe-chev" x="152" y="344"/>
  <use href="#dpipe-chev" x="152" y="386"/>
  <use href="#dpipe-chev" x="152" y="428"/>

  <!-- Side notes (brackets) -->
  <g fill="none" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.25">
    <path d="M292 100 h6 v66 h-6"/>
    <path d="M292 184 h6 v192 h-6"/>
    <path d="M292 394 h6 v24 h-6"/>
    <path d="M292 436 h6 v24 h-6"/>
  </g>
  <g font-size="13.5">
    <text x="308" y="126">QC and doublet</text>
    <text x="308" y="144">filtering</text>
    <text x="308" y="276">Embedding and</text>
    <text x="308" y="294">clusters</text>
    <text x="308" y="403">Wilcoxon markers;</text>
    <text x="308" y="420">CellTypist vs manual</text>
    <text x="308" y="445">Mice as replicates,</text>
    <text x="308" y="462">2×2 design</text>
  </g>

  <!-- Output -->
  <use href="#dpipe-chev" x="152" y="476"/>
  <rect x="24" y="488" width="432" height="68" rx="6" fill="#f2b84b" fill-opacity="0.13" stroke="#f2b84b" stroke-width="2"/>
  <use href="#dpipe-cell" x="54" y="522"/>
  <text x="80" y="514" font-size="14" fill-opacity="0.8">143,221 cells × 27,120 genes kept</text>
  <text x="80" y="538" font-size="15" font-weight="600">Trem2⁺/Gpnmb⁺/Cd9⁺ macrophage state</text>
</svg>
