<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 574" role="img" aria-labelledby="dddi-title dddi-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="currentColor">
  <title id="dddi-title">DDI extraction model architecture</title>
  <desc id="dddi-desc">A sentence is encoded by PubMedBERT into text features. DrugBank and the DDI corpus form a knowledge graph of 5,719 entities, 264 relation types and 479K triplets, embedded with RotatE. Text features and graph embeddings are fused and a classifier predicts one of 5 DDI classes; my KGE–multi-focal loss is used to train it. Solid outlines mark my parts; dashed outlines mark my teammate's; the classifier itself is unmarked.</desc>

  <defs>
    <path id="dddi-down" d="M0 0 V18 M-5 13 L0 18 L5 13" fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>

  <!-- Lane labels -->
  <g font-size="12.5" font-weight="600" letter-spacing="1.2" fill-opacity="0.65" text-anchor="middle">
    <text x="130" y="18">TEXT</text>
    <text x="390" y="18">KNOWLEDGE GRAPH</text>
  </g>

  <!-- Text lane (teammate's text features: dashed) -->
  <rect x="16" y="30" width="228" height="56" rx="6" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.25" stroke-dasharray="5 4"/>
  <g fill="none" stroke="currentColor" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round">
    <path d="M32 50 h22 M32 58 h30 M32 66 h18"/>
  </g>
  <text x="74" y="55" font-size="15" font-weight="600">Sentence with</text>
  <text x="74" y="74" font-size="15" font-weight="600">a drug pair</text>
  <use href="#dddi-down" x="130" y="92"/>
  <rect x="16" y="116" width="228" height="44" rx="6" fill="#8a4fb3" fill-opacity="0.12" stroke="#8a4fb3" stroke-width="1.75" stroke-dasharray="5 4"/>
  <text x="130" y="143" font-size="15" font-weight="600" text-anchor="middle">PubMedBERT</text>
  <use href="#dddi-down" x="130" y="166"/>
  <rect x="16" y="190" width="228" height="40" rx="20" fill="#8a4fb3" fill-opacity="0.06" stroke="#8a4fb3" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="130" y="215" font-size="14.5" text-anchor="middle">Text features</text>

  <!-- KG lane (mine: solid) -->
  <rect x="276" y="30" width="228" height="56" rx="6" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.25"/>
  <g fill="#3b72c4" fill-opacity="0.15" stroke="#3b72c4" stroke-width="1.75">
    <ellipse cx="302" cy="47" rx="12" ry="4.5"/>
    <path d="M290 47 v18 a12 4.5 0 0 0 24 0 v-18"/>
  </g>
  <text x="326" y="55" font-size="15" font-weight="600">DrugBank XML</text>
  <text x="326" y="74" font-size="15" font-weight="600">+ DDI corpus</text>
  <use href="#dddi-down" x="390" y="92"/>
  <rect x="276" y="116" width="228" height="84" rx="6" fill="#3b72c4" fill-opacity="0.1" stroke="#3b72c4" stroke-width="1.75"/>
  <g stroke="#3b72c4" stroke-width="1.5" stroke-linecap="round">
    <path d="M296 144 L314 136 M296 144 L304 162 M314 136 L322 154 M304 162 L322 154 M314 136 L304 162" fill="none"/>
    <g fill="#3b72c4" fill-opacity="0.35">
      <circle cx="296" cy="144" r="4"/>
      <circle cx="314" cy="136" r="4"/>
      <circle cx="304" cy="162" r="4"/>
      <circle cx="322" cy="154" r="4"/>
    </g>
  </g>
  <text x="336" y="139" font-size="15" font-weight="600">Knowledge graph</text>
  <text x="336" y="157" font-size="12.5" fill-opacity="0.8">5,719 entities</text>
  <text x="336" y="173" font-size="12.5" fill-opacity="0.8">264 relation types</text>
  <text x="336" y="189" font-size="12.5" fill-opacity="0.8">479K triplets</text>
  <use href="#dddi-down" x="390" y="206"/>
  <rect x="276" y="230" width="228" height="40" rx="20" fill="#8a4fb3" fill-opacity="0.12" stroke="#8a4fb3" stroke-width="1.75"/>
  <text x="390" y="255" font-size="14.5" font-weight="600" text-anchor="middle">RotatE embeddings</text>

  <!-- Merge -->
  <g fill="none" stroke="currentColor" stroke-opacity="0.5" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M130 230 V286 Q130 296 140 296 H250 Q260 296 260 306 V316"/>
    <path d="M390 270 V286 Q390 296 380 296 H270 Q260 296 260 306"/>
    <path d="M255 311 L260 316 L265 311"/>
  </g>
  <rect x="140" y="322" width="240" height="40" rx="6" fill="#8a4fb3" fill-opacity="0.12" stroke="#8a4fb3" stroke-width="1.75"/>
  <text x="260" y="347" font-size="15" font-weight="600" text-anchor="middle">Fuse text + graph</text>
  <use href="#dddi-down" x="260" y="368"/>

  <!-- Classifier: unmarked (neither legend state); only its loss is mine -->
  <rect x="100" y="392" width="320" height="76" rx="6" fill="currentColor" fill-opacity="0.06"/>
  <text x="260" y="416" font-size="15" font-weight="600" text-anchor="middle">Classifier</text>
  <rect x="160" y="428" width="200" height="28" rx="14" fill="#8a4fb3" fill-opacity="0.14" stroke="#8a4fb3" stroke-width="1.75"/>
  <text x="260" y="447" font-size="13.5" font-weight="600" text-anchor="middle">KGE–multi-focal loss</text>
  <use href="#dddi-down" x="260" y="474"/>

  <!-- Output: 5 classes -->
  <g fill="#8a4fb3" fill-opacity="0.3" stroke="#8a4fb3" stroke-width="1.5">
    <circle cx="208" cy="510" r="7"/>
    <circle cx="234" cy="510" r="7"/>
    <circle cx="260" cy="510" r="7"/>
    <circle cx="286" cy="510" r="7"/>
    <circle cx="312" cy="510" r="7"/>
  </g>
  <text x="260" y="538" font-size="14.5" font-weight="600" text-anchor="middle">5 DDI classes</text>

  <!-- Legend -->
  <g font-size="12" fill-opacity="0.75">
    <rect x="16" y="554" width="18" height="11" rx="2" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.25"/>
    <text x="40" y="564">my part</text>
    <rect x="108" y="554" width="18" height="11" rx="2" fill="none" stroke="currentColor" stroke-opacity="0.6" stroke-width="1.25" stroke-dasharray="4 3"/>
    <text x="132" y="564">teammate's part</text>
  </g>
</svg>
